
spring.application.name=lavanderia
server.port=8080

# PostgreSQL
spring.datasource.url=${LAVANDERIA_DB_URL}
spring.datasource.username=${LAVANDERIA_DB_USER}
spring.datasource.password=${LAVANDERIA_DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL administrado fuera del arranque
spring.flyway.enabled=false
spring.sql.init.mode=never

# Seguridad de la API
lavanderia.jwt.secret=${LAVANDERIA_JWT_SECRET:}
lavanderia.jwt.ttl-seconds=${LAVANDERIA_JWT_TTL_SECONDS:3600}
lavanderia.cors.origins=${LAVANDERIA_CORS_ORIGINS:}
